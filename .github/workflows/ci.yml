#
# The build and lugh_tests on Debian 13, as the nodes have it: GCC on x86-64 and on arm64 (as a
# build node builds it), and clang with its thread-safety analysis. Lugh fetches Dannan, Dagda and Lir
# from sibling checkouts at their pins, so each is checked out beside Lugh with its tags. The
# sanitizer runs and the fuzz campaigns stay on the cluster.
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['TODO/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['TODO/**', 'docs/**', '**/*.md']

# A newer push to the same branch cancels the run it makes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.compiler }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, arch: x86-64, runner: ubuntu-24.04, cxx: g++ }
          - { compiler: gcc, arch: arm64, runner: ubuntu-24.04-arm, cxx: g++ }
          - { compiler: clang, arch: x86-64, runner: ubuntu-24.04, cxx: clang++ }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev libgmock-dev libldap-dev

      - uses: actions/checkout@v4
        with:
          path: lugh

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/dannan
          path: dannan
          fetch-depth: 0  # the pinned tag

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/dagda
          path: dagda
          fetch-depth: 0  # the pinned tag

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/lir
          path: lir
          fetch-depth: 0  # the pinned commit

      - name: Trust the checkouts
        run: |
          for repo in lugh dannan dagda lir; do git config --global --add safe.directory "$GITHUB_WORKSPACE/$repo"; done

      - name: Build
        working-directory: lugh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DLUGH_INSTALL_SYSTEM=OFF
          cmake --build build -j "$(nproc)"

      - name: Test
        working-directory: lugh
        run: build/lugh_tests --gtest_brief=1

  # The npm workspace: @lugh/admin-ui (lugh/ui), the stack's admin UI shell, and the dashboard on
  # it. Node 20, as Debian 13 and the build nodes have it.
  admin-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # A value used after it was moved, including an argument read in the same call that moves it:
  # C++ leaves the order unspecified, and GCC on x86-64 reverses it (2026-11-20, three records
  # stored empty). Lugh's own files; the deps' findings go to their owners.
  use-after-move:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang clang-tidy cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev libgmock-dev libldap-dev

      - uses: actions/checkout@v4
        with:
          path: lugh

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/dannan
          path: dannan
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/dagda
          path: dagda
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/lir
          path: lir
          fetch-depth: 0

      - name: Trust the checkouts
        run: |
          for repo in lugh dannan dagda lir; do git config --global --add safe.directory "$GITHUB_WORKSPACE/$repo"; done

      - name: clang-tidy
        working-directory: lugh
        run: |
          cmake -S . -B tidy -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DLUGH_INSTALL_SYSTEM=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          run-clang-tidy -quiet -p tidy -j "$(nproc)" -checks='-*,bugprone-use-after-move' \
            -warnings-as-errors='bugprone-use-after-move' "$PWD/(lugh|tools)/"

  # Line and branch coverage of Lugh's own code (not its tests, Dannan or Dagda), kept near 100%
  # (the maintainer, 2026-11-20), to Codecov.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates openssl lcov \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev libgmock-dev libldap-dev \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4
        with:
          path: lugh

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/dannan
          path: dannan
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/dagda
          path: dagda
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: tomdionysus/lir
          path: lir
          fetch-depth: 0

      - name: Trust the checkouts
        run: |
          for repo in lugh dannan dagda lir; do git config --global --add safe.directory "$GITHUB_WORKSPACE/$repo"; done

      - name: Build
        working-directory: lugh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLUGH_COVERAGE=ON -DLUGH_INSTALL_SYSTEM=OFF
          cmake --build build -j "$(nproc)"

      - name: Test
        working-directory: lugh
        run: build/lugh_tests --gtest_brief=1

      # Captured and uploaded after a failed test too, so Codecov tracks what ran; the job still fails.
      - name: Capture coverage
        if: ${{ !cancelled() }}
        working-directory: lugh
        run: |
          lcov --capture --directory build --output-file build/coverage.info --branch-coverage --ignore-errors mismatch,negative,unused,inconsistent
          lcov --extract build/coverage.info "$PWD/lugh/*" "$PWD/tools/*" --output-file build/coverage.info --branch-coverage --ignore-errors unused,inconsistent
          lcov --remove build/coverage.info "$PWD/lugh/test/*" "$PWD/lugh/fuzz/*" --output-file build/coverage.info --branch-coverage --ignore-errors unused,inconsistent
          lcov --summary build/coverage.info --branch-coverage --ignore-errors inconsistent

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: lugh/build/coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
