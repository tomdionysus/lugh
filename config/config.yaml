#
# Lugh configuration
#
# Installed to /usr/local/etc/lugh/config.yaml on a node. Secrets go in secrets.yaml beside
# it, in the same shape, and win over this file; never here. The environment (LUGH_*) and
# the command line win over both, which is how the unit sets the port and the installed
# certificate paths without editing this file. The master key is in none of these: it
# arrives as a systemd credential, or is typed at start on a host without one.
#
# Run from the repository root in development, after tools/lugh_dev_cert.sh and
# tools/lugh_dev_init.sh:
#
#   CREDENTIALS_DIRECTORY=config/dev/credentials ./build/lugh-node --config config/config.yaml
#

log:
  # debug, info, warn or error.
  level: info
  # text for the journal, json for a shipper.
  format: text

server:
  # Every address. The unit sets port 443.
  address: "0.0.0.0"
  port: 8443
  threads: 2

tls:
  # client_ca: the CA a client certificate must chain to for its subject to name an
  # application; without it, only a certificate's thumbprint does.
  # There is no plaintext listener: both are required. TLS 1.3 and nothing older. These
  # are the development pair that tools/lugh_dev_cert.sh writes; the unit points at the
  # installed ones.
  certificate: "config/dev/cert.pem"
  key: "config/dev/key.pem"

state:
  # The keyring and the store. The development directory, which
  # tools/lugh_dev_init.sh fills; the unit points at /var/lib/lugh.
  directory: "config/dev/state"

proxy:
  # A request from one of these is taken at the last address in its X-Forwarded-For, the
  # one that proxy appended. Anything else is taken at its socket's address, and any
  # forwarding header it sends is ignored: anyone can write one. Empty, as here, means no
  # proxy is trusted and every request is its socket's address.
  trusted_networks: []

authn:
  # A list of passwords no one may set, one per line, folded to lower case when read; '#'
  # starts a comment. Leave it out to check length and the user's own name and address
  # only. Read once at start; a list that cannot be read stops the start.
  # breached_passwords: "/usr/local/etc/lugh/breached-passwords.txt"

oauth:
  # Whether an application may authenticate with a client secret (client_secret_basic).
  # Off: applications use private_key_jwt or a TLS client certificate, so Lugh holds no
  # secret of theirs, only a public key or a certificate's name.
  allow_client_secrets: false
  # The issuer: every token's iss, and the base of the metadata's URLs. The public https URL
  # clients reach Lugh at, without a trailing '/'. Left out, no metadata is served.
  issuer: "https://localhost:8443"
  # A second listener that asks every connection for a client certificate (RFC 8705): for
  # applications that authenticate with one (tls_client_auth) or whose tokens are bound to
  # one. Left out, there is none. The main listener never asks, so a browser never sees a
  # certificate picker.
  # mtls_port: 8444
  # outbound_ca: the roots an application's certificate must chain to when Lugh posts a
  # back-channel logout to it; the system's when not set.
  # outbound_ca: /etc/lugh/outbound-roots.pem

ldap:
  # LDAPS, and a plaintext port that does nothing but StartTLS and the rootDSE. Left out, that
  # listener is not there. TLS is the same as the HTTPS listener's: 1.3 only.
  # port: 636
  # starttls_port: 389
  # The top of the tree; required for either. Lugh does not guess it.
  # base_dn: dc=example,dc=com
  # Operations a connection may have queued before Lugh stops reading it.
  # most_pending: 8
  # Seconds a connection may do nothing. Long, since SSSD and mail servers hold one open.
  # idle: 600
  # Whether a bind with no name and no password succeeds, as a stock client's first step does even
  # to read the rootDSE. It stays anonymous, which reads the rootDSE and nothing else.
  # anonymous_bind: false
  # POSIX numbers, for posixAccount and posixGroup. A person or a group gets one when made, never
  # reused; POST /api/v1/ldap/posix/allocate numbers what was made before these were set. Each
  # range is first-last. All three of these go together.
  # posix:
  #   uid_range: 10000-59999
  #   gid_range: 10000-59999
  #   primary_group: staff
  #   home: /home/{name}
  #   shell: /bin/bash
